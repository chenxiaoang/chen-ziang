            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

            padding: 10px 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .option:hover {
            background-color: #e0e0e0;
        }
        .correct {
            background-color: #d4edda;
            border: 1px solid #27a68d;
        }
        .wrong {
            background-color: #f8d7da;
            border: 1px solid #c94c4c;
        }

            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }

            padding: 10px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

            padding: 8px 16px;
            margin-top: 10px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;

            background: #1976D2;

            display: none;
            margin: 20px 0;

            height: 20px;

            padding: 15px;

    <div class="container">

        <!-- 控制面板 -->
        <div class="controls">

            <button class="mode-btn active-mode" onclick="setMode('all')">全部题目</button>
            <button class="mode-btn" onclick="setMode('判断题')">判断题</button>
            <button class="mode-btn" onclick="setMode('选择题')">选择题</button>
            <button class="mode-btn" onclick="setMode('填空题')">填空题</button>
            <button class="mode-btn" onclick="setMode('背题')">背题模式</button>
        </div>
        <!-- 进度条 -->
        <div class="progress-container" id="progress-container">
            <progress id="progress-bar" value="0" max="100"></progress>
            <div id="progress-text">已完成 0 / 0 题</div>
        </div>
        <!-- 题目容器 -->
        <div id="quiz-container"></div>
        <!-- 错题列表 -->
        <div class="error-list" id="error-list" style="display:none;">
            <h3>错题记录</h3>

        <!-- 控制按钮 -->

            <button onclick="prevQuestion()">上一题</button>
            <button onclick="nextQuestion()">下一题</button>
            <button onclick="restartQuiz()">重新开始</button>

        let currentMode = 'all';
        let filteredQuestions = [];
        let currentQuestionIndex = 0;
        let errorQuestions = [];
        let isShuffleEnabled = false;
        let userAnswers = [];

        // 洗牌函数（Fisher-Yates算法）
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 设置练习模式
        function setMode(mode) {
            isShuffleEnabled = document.getElementById('shuffle-toggle').checked;
            currentMode = mode;
            // 高亮当前按钮
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active-mode'));
            event.target.classList.add('active-mode');

            let tempQuestions = [];
            if (mode === 'all') {
                tempQuestions = [...rawQuestions];
            } else if (mode === '背题') {
                // ✅ 背题模式仅显示判断题和填空题
                tempQuestions = [...rawQuestions.filter(q => q.type !== '选择题')];
            } else {
                tempQuestions = [...rawQuestions.filter(q => q.type === mode)];
            }

            if (isShuffleEnabled && mode !== '背题') {
                filteredQuestions = shuffleArray(tempQuestions);
            } else {
                filteredQuestions = tempQuestions;
            }

            currentQuestionIndex = 0;
            errorQuestions = [];
            userAnswers = Array(filteredQuestions.length).fill(null);
            updateProgress();
            loadQuestion();
        }

        // 加载题目
        function loadQuestion() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            if (currentQuestionIndex >= filteredQuestions.length) {
                container.innerHTML = `<div class="question">已完成所有题目！</div>`;
                showErrorList();
                return;
            }

            const q = filteredQuestions[currentQuestionIndex];
            container.innerHTML = `
                <div class="question">
                    <h3>${currentQuestionIndex + 1}. ${q.question}</h3>
                    <div class="options"></div>
                </div>
            `;
            const optionsContainer = container.querySelector('.options');

            // 背题模式：直接显示答案
            if (currentMode === '背题') {
                let answerText = '';
                if (q.type === '判断题') {
                    answerText = `✅ 正确答案：${q.answer}`;
                } else if (q.type === '选择题') {
                    answerText = `✅ 正确答案：${q.options.find(opt => opt.startsWith(q.answer))}`;
                } else if (q.type === '填空题') {
                    answerText = `✅ 正确答案：${q.answers.join(' / ')}`;
                }
                optionsContainer.innerHTML = `<div class="feedback">${answerText}</div>`;
                return;
            }

            // 判断题/选择题
            if (q.type === '判断题' || q.type === '选择题') {
                q.options.forEach(option => {
                    const btn = document.createElement('div');
                    btn.className = 'option';
                    btn.textContent = option;
                    if (userAnswers[currentQuestionIndex]) {
                        const selectedLetter = option.charAt(0);
                        const correctLetter = userAnswers[currentQuestionIndex].answer?.charAt(0);
                        if (selectedLetter === correctLetter) {
                            btn.classList.add('correct');
                        } else {
                            btn.classList.add('wrong');
                        }
                        btn.style.pointerEvents = 'none';
                    } else {
                        btn.onclick = () => checkAnswer(btn, option, q);
                    }
                    optionsContainer.appendChild(btn);
                });
            }

            // 填空题
            if (q.type === '填空题') {
                for (let i = 0; i < q.answers.length; i++) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.id = `blank-input-${i}`;
                    input.placeholder = `空格 ${i + 1}`;
                    if (userAnswers[currentQuestionIndex]) {
                        input.value = userAnswers[currentQuestionIndex]?.userInputs?.[i] || '';
                        input.disabled = true;
                    }
                    optionsContainer.appendChild(input);
                }

                const submitBtn = document.createElement('button');
                submitBtn.textContent = '提交';
                submitBtn.className = 'submit-btn';
                submitBtn.onclick = () => checkMultiBlankAnswer(q.answers, optionsContainer);
                optionsContainer.appendChild(submitBtn);
            }
        }

        // 判断题/选择题答案验证
        function checkAnswer(element, selectedOption, question) {
            const optionsContainer = document.querySelector('.options');
            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            feedback.style.marginTop = '15px';

            // 禁用所有选项
            document.querySelectorAll('.option').forEach(opt => {
                opt.style.pointerEvents = 'none';
            });

            // 提取选项字母进行比较
            const selectedLetter = selectedOption.charAt(0);
            const correctLetter = question.answer.charAt(0);
            userAnswers[currentQuestionIndex] = {
                isCorrect: selectedLetter === correctLetter,
                answer: selectedLetter
            };

            // 显示反馈
            if (selectedLetter === correctLetter) {
                element.classList.add('correct');
                feedback.textContent = `✔ 正确！正确答案：${question.answer}`;
                feedback.style.color = '#155724';
            } else {
                element.classList.add('wrong');
                feedback.textContent = `✘ 错误！正确答案：${question.answer}`;
                feedback.style.color = '#721c24';
                errorQuestions.push(question);
            }

            optionsContainer.appendChild(feedback);
            saveProgress(); // 自动保存进度
        }

        // 填空题答案验证
        function checkMultiBlankAnswer(correctAnswers, optionsContainer) {
            const inputs = document.querySelectorAll('input[type="text"]');
            const userInputs = Array.from(inputs).map(input => input.value.trim().toLowerCase());
            const correctFlags = userInputs.map((input, i) => input === correctAnswers[i].toLowerCase());

            userAnswers[currentQuestionIndex] = {
                isCorrect: correctFlags.every(flag => flag),
                userInputs: userInputs
            };

            inputs.forEach(input => input.disabled = true);

            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            feedback.style.marginTop = '15px';

            if (userAnswers[currentQuestionIndex].isCorrect) {
                feedback.textContent = '✔ 正确！';
                feedback.style.color = '#155724';
            } else {
                let feedbackText = '✘ 错误！正确答案：<br>';
                for (let i = 0; i < correctAnswers.length; i++) {
                    feedbackText += `空格 ${i + 1}：${correctAnswers[i]}<br>`;
                }
                feedback.innerHTML = feedbackText;
                feedback.style.color = '#721c24';
                errorQuestions.push(filteredQuestions[currentQuestionIndex]);
            }

            optionsContainer.appendChild(feedback);
            saveProgress(); // 自动保存进度
        }

        // 显示错题列表
        function showErrorList() {
            const errorList = document.getElementById('error-items');
            const errorContainer = document.getElementById('error-list');
            errorList.innerHTML = '';
            if (errorQuestions.length === 0) {
                errorContainer.style.display = 'none';
                return;
            }

            errorQuestions.forEach((q, index) => {
                const li = document.createElement('li');
                if (q.answers) {
                    li.textContent = `${index + 1}. ${q.question}（正确答案：${q.answers.join(' / ')}）`;
                } else if (q.type === '判断题' || q.type === '选择题') {
                    li.textContent = `${index + 1}. ${q.question}（正确答案：${q.answer}）`;
                }
                errorList.appendChild(li);
            });

            errorContainer.style.display = 'block';
        }

        // 随机练习错题
        function reviewRandomErrors() {
            if (errorQuestions.length === 0) {
                alert('暂无错题记录');
                return;
            }
            filteredQuestions = shuffleArray([...errorQuestions]);
            currentQuestionIndex = 0;
            errorQuestions = [];
            updateProgress();
            loadQuestion();
        }

        // 上一题
        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                updateProgress();
                loadQuestion();
            }
        }

        // 下一题
        function nextQuestion() {
            if (currentQuestionIndex < filteredQuestions.length - 1) {
                currentQuestionIndex++;
                updateProgress();
                loadQuestion();
            }
        }

        // 重新开始
        function restartQuiz() {
            currentQuestionIndex = 0;
            errorQuestions = [];
            userAnswers = Array(filteredQuestions.length).fill(null);
            updateProgress();
            loadQuestion();
        }

        // 更新进度条
        function updateProgress() {
            const total = filteredQuestions.length;
            const current = currentQuestionIndex + 1;
            const percent = total ? Math.round(current / total * 100) : 0;
            document.getElementById('progress-bar').value = percent;
            document.getElementById('progress-text').textContent = `已完成 ${current} / ${total} 题`;
        }

        // 保存进度
        function saveProgress() {
            const progress = {
                mode: currentMode,
                index: currentQuestionIndex,
                answers: userAnswers,
                errors: errorQuestions
            };
            localStorage.setItem('plc_quiz_progress', JSON.stringify(progress));
        }

        // 页面加载时恢复进度
        window.onload = () => {
            const saved = localStorage.getItem('plc_quiz_progress');
            if (saved) {
                const progress = JSON.parse(saved);
                currentMode = progress.mode;
                currentQuestionIndex = progress.index;
                userAnswers = progress.answers;
                errorQuestions = progress.errors;
                setMode(currentMode);
            } else {
                setMode('all');
            }
        };
    </script>
